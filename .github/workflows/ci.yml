name: CI

on:
  push:
    # main, and the MVP sprint branches: a pushed sprint branch runs at exactly its SHA.
    branches: [main, "t/mvp-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Minutes on the private repo are the user's, and Windows minutes count double.
# A t/mvp-* branch already runs on push, so a pull request from one does not run
# the same SHA again: every job below skips that case.

jobs:
  smoke:
    # The fast job, and the acceptance check for the shipped artifact: build the
    # release archive from a clean copy of the tracked files, unpack it into a
    # path with a space, and run THAT, never dist/ of this checkout: the
    # launchers (on Windows git-huddle.cmd from PowerShell and CMD),
    # `git huddle` through PATH, init for Claude Code and Codex, and the
    # two-clone demo driven by the unpacked artifact.
    name: Smoke (Node 22, ${{ matrix.os }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 't/mvp-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-evidence.mjs platform smoke-evidence ($PSVersionTable.PSVersion.ToString())
      - run: npm ci
      - run: npm run typecheck
      - name: Release archive from clean source, unpacked and run, with the two-clone demo
        run: node scripts/mvp-delivery-release.mjs --keep smoke-evidence
      - name: Keep the smoke evidence and the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-evidence
          if-no-files-found: ignore

  test:
    name: Typecheck and test (Node 22, ${{ matrix.os }}, shard ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 't/mvp-')
    strategy:
      # Linux and native Windows are both MVP platforms: one failing must not
      # cancel the other's evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Hosted runners are several times slower than a workstation (ubuntu took
        # about 5 minutes for the whole suite), so each OS runs it in three shards.
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        # PowerShell 7 on both runners: it is the documented Windows shell, and
        # one shell keeps the steps identical across platforms.
        shell: pwsh
    env:
      # test/mvp-delivery-platform.test.ts fails unless the suite really runs here.
      HUDDLE_EXPECT_PLATFORM: ${{ matrix.os == 'windows-latest' && 'win32' || 'linux' }}
      HUDDLE_JOB: ${{ matrix.os }}-shard${{ matrix.shard }}
    steps:
      # Windows runners default core.autocrlf to true. Keep that: users on
      # Windows check out the vendored bundle and fixtures with CRLF too.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record the platform under test
        run: |
          node scripts/ci-evidence.mjs platform evidence ($PSVersionTable.PSVersion.ToString())
          if ($IsWindows) { [System.Environment]::OSVersion.VersionString; cmd /c ver }
          git config --show-origin --show-scope --get-all core.autocrlf
          exit 0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Assert the platform matches the runner
        run: |
          node -e "if (process.platform !== process.argv[1]) { console.error('platform ' + process.platform + ' != ' + process.argv[1]); process.exit(1) }" $env:HUDDLE_EXPECT_PLATFORM
          node dist/huddle.mjs --version
          node dist/huddle.mjs --help
      - name: Test
        timeout-minutes: 30
        run: node --test --test-shard=${{ matrix.shard }}/3 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=evidence/test-results.xml "test/**/*.test.ts"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-shard${{ matrix.shard }}
          path: evidence
          if-no-files-found: ignore

  evidence:
    # One place to read the result per platform: SHA, OS build, architecture,
    # shell, Node and git versions, totals, every skip with its reason, every failure.
    name: Evidence summary (Linux and Windows)
    needs: test
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 't/mvp-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: all-evidence
      - run: node scripts/ci-evidence.mjs summary all-evidence --expect linux=3,win32=3

  bundle-node20:
    name: CLI tests with the bundle on Node 20
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 't/mvp-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 20 first, only to learn where it is installed. The tests themselves
      # need Node 22 (they import TypeScript directly); every test that runs the
      # CLI then runs the bundle with the Node 20 binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "HUDDLE_TEST_NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          "$HUDDLE_TEST_NODE" --version
          "$HUDDLE_TEST_NODE" dist/huddle.mjs --version
          "$HUDDLE_TEST_NODE" dist/huddle.mjs --help
      - run: npm test
