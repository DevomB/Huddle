name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test (Node 22, ${{ matrix.os }}, shard ${{ matrix.shard }}/3)
    strategy:
      # Linux and native Windows are both MVP platforms: one failing must not
      # cancel the other's evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Hosted runners are several times slower than a workstation (ubuntu took
        # about 5 minutes for the whole suite), so each OS runs it in three shards.
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        # PowerShell 7 on both runners: it is the documented Windows shell, and
        # one shell keeps the steps identical across platforms.
        shell: pwsh
    env:
      # test/mvp-delivery-platform.test.ts fails unless the suite really runs here.
      HUDDLE_EXPECT_PLATFORM: ${{ matrix.os == 'windows-latest' && 'win32' || 'linux' }}
    steps:
      # Windows runners default core.autocrlf to true. Keep that: users on
      # Windows check out the vendored bundle and fixtures with CRLF too.
      - run: git config --global --get core.autocrlf; exit 0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record the platform under test
        run: |
          node -e "const os=require('node:os');console.log(JSON.stringify({platform:process.platform,arch:process.arch,release:os.release(),version:os.version(),node:process.version,shell:'pwsh '+process.env.PSVersion},null,1))"
          $PSVersionTable.PSVersion.ToString()
          git --version
          npm --version
          if ($IsWindows) { [System.Environment]::OSVersion.VersionString; cmd /c ver }
          git config --show-origin --show-scope --get-all core.autocrlf
          "runner image: $env:ImageOS $env:ImageVersion"
          exit 0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Assert the platform matches the runner
        run: |
          $expected = if ($IsWindows) { 'win32' } else { 'linux' }
          node -e "if (process.platform !== process.argv[1]) { console.error('platform ' + process.platform + ' != ' + process.argv[1]); process.exit(1) }" $expected
          node dist/huddle.mjs --version
          node dist/huddle.mjs --help
      - name: Test
        timeout-minutes: 30
        run: node --test --test-shard=${{ matrix.shard }}/3 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml "test/**/*.test.ts"
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-shard${{ matrix.shard }}
          path: test-results.xml
          if-no-files-found: ignore

  bundle-node20:
    name: CLI tests with the bundle on Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 20 first, only to learn where it is installed. The tests themselves
      # need Node 22 (they import TypeScript directly); every test that runs the
      # CLI then runs the bundle with the Node 20 binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "HUDDLE_TEST_NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          "$HUDDLE_TEST_NODE" --version
          "$HUDDLE_TEST_NODE" dist/huddle.mjs --version
          "$HUDDLE_TEST_NODE" dist/huddle.mjs --help
      - run: npm test
